name = "easytier-ws-relay-worker"
main = "src/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
WS_PATH = "ws"
EASYTIER_DISABLE_RELAY = "0"
EASYTIER_MAX_CONNECTIONS = "128"
EASYTIER_MAX_ROUTE_PEERS = "256"
EASYTIER_MAX_TOTAL_ROUTE_PEERS = "1024"
EASYTIER_MAX_PEER_INFO_BYTES = "4096"
EASYTIER_MAX_FRAME_BYTES = "1048576"
EASYTIER_MAX_MESSAGES_PER_SECOND = "1000"
EASYTIER_MAX_BYTES_PER_SECOND = "8388608"
EASYTIER_ROUTE_BROADCAST_INTERVAL_MS = "100"
LOCATION_HINT = "apac"

[durable_objects]
bindings = [
  { name = "RELAY_ROOM", class_name = "RelayRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]
